[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG Python FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=44.0.0",
    "bcrypt>=4.2.1",
    "python-multipart>=0.0.19",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "boto3>=1.35.0",
    "opentelemetry-api>=1.27.0,<2",
    "opentelemetry-sdk>=1.27.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2",
    "pymilvus==3.0.2",
    "langchain==1.4.2",
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    "langfuse==4.16.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
