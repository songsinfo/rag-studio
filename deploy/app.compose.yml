# Additional application services for the cross-platform Docker Quick Start.
# Start alongside compose.yml: docker compose -f deploy/compose.yml -f deploy/app.compose.yml ...
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - ../.runtime/${RAG_ENVIRONMENT:-demo}.env
    environment:
      # Only the gateway and database need these credentials.
      MODEL_API_KEY: ""
      MODEL_BASE_URL: ""
      MYSQL_ROOT_PASSWORD: ""
      # The env file also supports host-native development; container DNS overrides are essential.
      DB_URL: ""
      DB_HOST: mysql
      DB_PORT: "3306"
      MILVUS_URI: http://milvus-standalone:19530
      LITELLM_BASE_URL: http://litellm:4000
      DOCLING_URL: http://docling:5001
      RAG_ARTIFACT_ROOT: /data/artifacts
      RAG_IMPORT_ROOT: /data/import
      S3_ENDPOINT_URL: http://artifact-minio:9000
      RAG_COOKIE_SECURE: "false"
    volumes:
      - ../.runtime/${RAG_ENVIRONMENT:-demo}/artifacts:/data/artifacts
      - ../.runtime/${RAG_ENVIRONMENT:-demo}/import:/data/import
    depends_on:
      mysql:
        condition: service_healthy
      milvus-standalone:
        condition: service_started
      litellm:
        condition: service_healthy
      docling:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 18
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      # Demo only; bind locally, do not expose the admin UI on a public interface.
      - "127.0.0.1:${RAG_WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
