services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rag_demo}
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docs/design/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
  docling:
    profiles: ["documents"]
    image: quay.io/docling-project/docling-serve-cpu:v1.32.0
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:?Set DOCLING_API_KEY}
      DOCLING_SERVE_MAX_FILE_SIZE: "26214400"
      DOCLING_SERVE_MAX_NUM_PAGES: "400"
    ports:
      - "127.0.0.1:${DOCLING_PORT:-5001}:5001"
    mem_limit: 4g
  artifact-minio:
    profiles: ["artifacts-s3"]
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-ragadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      - artifact-minio-data:/data
    command: minio server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${ARTIFACT_S3_PORT:-9001}:9000"
      - "127.0.0.1:${ARTIFACT_S3_CONSOLE_PORT:-9002}:9001"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:?Set MODEL_BASE_URL}
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY}
      LITELLM_CHAT_TARGET: "openai/${CHAT_MODEL:-deepseek-v4-flash-0731}"
      LITELLM_EMBEDDING_TARGET: "openai/${EMBEDDING_MODEL:-qwen3.7-text-embedding-flash}"
      LITELLM_JUDGE_TARGET: "openai/${JUDGE_MODEL:-kimi-k3}"
      LITELLM_RERANK_TARGET: "dashscope/${RERANK_MODEL:-rerank-default}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY}
      LITELLM_PORT: ${LITELLM_PORT:-4000}
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 20
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir=/etcd
  milvus-minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data
  milvus-standalone:
    image: milvusdb/milvus:v2.5.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
    depends_on:
      - milvus-etcd
      - milvus-minio
volumes:
  mysql-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  artifact-minio-data:
